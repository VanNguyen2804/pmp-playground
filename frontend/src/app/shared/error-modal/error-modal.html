<div class="modal-backdrop" *ngIf="state() as error" (click)="close()" role="presentation">
  <section class="error-modal" role="alertdialog" aria-modal="true" aria-labelledby="error-title" (click)="$event.stopPropagation()">
    <header>
      <div>
        <p class="eyebrow">{{ error.code || 'ERROR' }}<span *ngIf="error.status"> · HTTP {{ error.status }}</span></p>
        <h2 id="error-title">{{ error.title }}</h2>
      </div>
      <button type="button" class="icon-button" aria-label="Đóng" (click)="close()">×</button>
    </header>

    <p class="message">{{ error.message }}</p>

    <div class="error-section" *ngIf="fieldEntries(error.fieldErrors).length">
      <h3>Trường cần kiểm tra</h3>
      <ul>
        <li *ngFor="let field of fieldEntries(error.fieldErrors)"><strong>{{ field[0] }}:</strong> {{ field[1] }}</li>
      </ul>
    </div>

    <div class="error-section" *ngIf="error.details?.length">
      <h3>Chi tiết</h3>
      <ul class="details-list">
        <li *ngFor="let detail of error.details">{{ detail }}</li>
      </ul>
    </div>

    <dl class="technical" *ngIf="error.path || error.traceId">
      <div *ngIf="error.path"><dt>Request</dt><dd>{{ error.path }}</dd></div>
      <div *ngIf="error.traceId"><dt>Trace ID</dt><dd>{{ error.traceId }}</dd></div>
    </dl>

    <footer><button type="button" class="button primary" (click)="close()">Đóng</button></footer>
  </section>
</div>
