<section class="page-header">
  <div>
    <h1>Categories học PMP</h1>
    <p>Các chủ đề được chuẩn hóa từ PMBOK 8 và PMA Handout, ví dụ Risk Management, Agile & Hybrid và Project Management.</p>
  </div>
  <button class="button ghost" type="button" (click)="reclassify()" [disabled]="reclassifying || loading">
    {{ reclassifying ? 'Đang phân loại...' : 'Phân loại lại toàn bộ' }}
  </button>
</section>
<p class="success" *ngIf="success">{{ success }}</p>
<p *ngIf="loading">Đang tải...</p>

<section *ngIf="!loading">
  <div class="category-grid">
    <a class="card category-card" *ngFor="let c of categories" [routerLink]="['/questions']" [queryParams]="{categoryCode: c.code}">
      <span class="count">{{ c.questionCount }}</span>
      <h3>{{ c.name }}</h3>
      <p>{{ c.description }}</p>
      <code>{{ c.code }}</code>
    </a>
  </div>
</section>
