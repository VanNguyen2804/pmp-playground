<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Scatter diagram - Vehicle speed vs uncommanded lane departures</title>
  <desc id="desc">A scatter diagram showing a strong positive correlation between vehicle speed and uncommanded lane departures.</desc>
  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="70" y="40" width="840" height="430" rx="18" fill="#f8fbff" stroke="#bfd3ea" stroke-width="2"/>
  <text x="480" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#16324f">Scatter Diagram</text>
  <text x="480" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#44627d">Vehicle speed vs uncommanded lane departures</text>
  <line x1="150" y1="410" x2="820" y2="410" stroke="#3b4c5d" stroke-width="3"/>
  <line x1="150" y1="410" x2="150" y2="150" stroke="#3b4c5d" stroke-width="3"/>
  <text x="485" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#234">Vehicle speed</text>
  <text x="55" y="290" transform="rotate(-90 55,290)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#234">Uncommanded lane departures</text>
  <g stroke="#d8e2ef" stroke-width="1">
    <line x1="150" y1="360" x2="820" y2="360"/>
    <line x1="150" y1="310" x2="820" y2="310"/>
    <line x1="150" y1="260" x2="820" y2="260"/>
    <line x1="150" y1="210" x2="820" y2="210"/>
    <line x1="250" y1="410" x2="250" y2="150"/>
    <line x1="350" y1="410" x2="350" y2="150"/>
    <line x1="450" y1="410" x2="450" y2="150"/>
    <line x1="550" y1="410" x2="550" y2="150"/>
    <line x1="650" y1="410" x2="650" y2="150"/>
    <line x1="750" y1="410" x2="750" y2="150"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#567">
    <text x="150" y="430" text-anchor="middle">0</text>
    <text x="250" y="430" text-anchor="middle">20</text>
    <text x="350" y="430" text-anchor="middle">40</text>
    <text x="450" y="430" text-anchor="middle">60</text>
    <text x="550" y="430" text-anchor="middle">80</text>
    <text x="650" y="430" text-anchor="middle">100</text>
    <text x="750" y="430" text-anchor="middle">120</text>
    <text x="130" y="415" text-anchor="end">0</text>
    <text x="130" y="365" text-anchor="end">2</text>
    <text x="130" y="315" text-anchor="end">4</text>
    <text x="130" y="265" text-anchor="end">6</text>
    <text x="130" y="215" text-anchor="end">8</text>
    <text x="130" y="165" text-anchor="end">10</text>
  </g>
  <g fill="#2f80ed" fill-opacity="0.85" stroke="#1b5fbf" stroke-width="1.4">
    <circle cx="205" cy="382" r="8"/>
    <circle cx="230" cy="372" r="8"/>
    <circle cx="270" cy="350" r="8"/>
    <circle cx="320" cy="338" r="8"/>
    <circle cx="360" cy="320" r="8"/>
    <circle cx="405" cy="300" r="8"/>
    <circle cx="455" cy="278" r="8"/>
    <circle cx="500" cy="260" r="8"/>
    <circle cx="555" cy="240" r="8"/>
    <circle cx="610" cy="220" r="8"/>
    <circle cx="660" cy="200" r="8"/>
    <circle cx="715" cy="182" r="8"/>
    <circle cx="760" cy="170" r="8"/>
  </g>
  <line x1="190" y1="388" x2="780" y2="162" stroke="#e56b6f" stroke-width="4" stroke-dasharray="10 8"/>
  <rect x="640" y="95" width="200" height="54" rx="10" fill="#fff4dd" stroke="#f2c26b"/>
  <text x="740" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#7d4a00">Interpretation</text>
  <text x="740" y="137" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#7d4a00">Strong positive correlation</text>
</svg>
