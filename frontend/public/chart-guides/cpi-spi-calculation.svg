<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><rect width="1000" height="520" rx="28" fill="#f8fbff"/><text x="60" y="62" font-family="Arial" font-size="34" font-weight="700" fill="#102a56">Earned value calculation</text><text x="60" y="98" font-family="Arial" font-size="20" fill="#52637a">EV = 90 · PV = 100 · AC = 120</text><g font-family="Arial" text-anchor="middle"><rect x="90" y="150" width="250" height="115" rx="20" fill="#eaf2ff" stroke="#1769e0" stroke-width="3"/><text x="215" y="195" font-size="24" font-weight="700" fill="#175cd3">EV = 90</text><text x="215" y="230" font-size="18" fill="#52637a">Earned Value</text><rect x="375" y="150" width="250" height="115" rx="20" fill="#f5f3ff" stroke="#7f56d9" stroke-width="3"/><text x="500" y="195" font-size="24" font-weight="700" fill="#6941c6">PV = 100</text><text x="500" y="230" font-size="18" fill="#52637a">Planned Value</text><rect x="660" y="150" width="250" height="115" rx="20" fill="#fff1f1" stroke="#d92d20" stroke-width="3"/><text x="785" y="195" font-size="24" font-weight="700" fill="#b42318">AC = 120</text><text x="785" y="230" font-size="18" fill="#52637a">Actual Cost</text><rect x="115" y="320" width="350" height="115" rx="20" fill="#fff" stroke="#d0d5dd" stroke-width="2"/><text x="290" y="363" font-size="27" font-weight="700" fill="#102a56">CPI = EV / AC</text><text x="290" y="405" font-size="27" font-weight="700" fill="#b42318">90 / 120 = 0.75</text><rect x="535" y="320" width="350" height="115" rx="20" fill="#fff" stroke="#d0d5dd" stroke-width="2"/><text x="710" y="363" font-size="27" font-weight="700" fill="#102a56">SPI = EV / PV</text><text x="710" y="405" font-size="27" font-weight="700" fill="#b42318">90 / 100 = 0.90</text></g><text x="500" y="485" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#b42318">Both indices are below 1.0 → over budget and behind schedule</text></svg>