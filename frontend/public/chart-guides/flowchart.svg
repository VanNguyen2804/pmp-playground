<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">Flowchart / process map</title><desc id="desc">Reveal steps, decisions, handoffs and rework loops</desc>
<rect width="900" height="420" rx="24" fill="#f8fafc"/>
<rect x="1" y="1" width="898" height="418" rx="23" fill="none" stroke="#dbeafe" stroke-width="2"/>
<text x="42" y="50" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Flowchart / process map</text>
<text x="42" y="78" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Reveal steps, decisions, handoffs and rework loops</text>
<defs><marker id="f" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><ellipse cx="150" cy="210" rx="70" ry="32" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="150" y="216" text-anchor="middle" font-family="Arial" font-size="15" fill="#166534">Start</text><rect x="285" y="182" width="165" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="367" y="216" text-anchor="middle" font-family="Arial" font-size="15" fill="#1e3a8a">Review request</text><polygon points="565,165 630,210 565,255 500,210" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/><text x="565" y="216" text-anchor="middle" font-family="Arial" font-size="14" fill="#92400e">Complete?</text><rect x="700" y="125" width="140" height="52" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="770" y="157" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">Approve</text><rect x="700" y="280" width="140" height="52" rx="10" fill="#fee2e2" stroke="#64748b"/><text x="770" y="312" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">Rework</text><line x1="220" y1="210" x2="280" y2="210" stroke="#64748b" stroke-width="3" marker-end="url(#f)"/><line x1="450" y1="210" x2="500" y2="210" stroke="#64748b" stroke-width="3" marker-end="url(#f)"/><line x1="630" y1="190" x2="700" y2="151" stroke="#64748b" stroke-width="3" marker-end="url(#f)"/><line x1="630" y1="230" x2="700" y2="306" stroke="#64748b" stroke-width="3" marker-end="url(#f)"/><line x1="700" y1="306" x2="610" y2="306" stroke="#64748b" stroke-width="3" marker-end="url(#f)"/><line x1="610" y1="306" x2="565" y2="255" stroke="#64748b" stroke-width="3" marker-end="url(#f)"/><text x="655" y="170" font-family="Arial" font-size="13" fill="#15803d">Yes</text><text x="655" y="270" font-family="Arial" font-size="13" fill="#b91c1c">No</text>
</svg>