<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">Milestone chart</title><desc id="desc">Highlight major zero-duration events and decision points</desc>
<rect width="900" height="420" rx="24" fill="#f8fafc"/>
<rect x="1" y="1" width="898" height="418" rx="23" fill="none" stroke="#dbeafe" stroke-width="2"/>
<text x="42" y="50" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Milestone chart</text>
<text x="42" y="78" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Highlight major zero-duration events and decision points</text>
<line x1="105" y1="245" x2="815" y2="245" stroke="#334155" stroke-width="5"/><polygon points="150,225 170,245 150,265 130,245" fill="#f59e0b"/><line x1="150" y1="190" x2="150" y2="225" stroke="#94a3b8" stroke-width="2"/><text x="150" y="175" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">Charter</text><polygon points="300,225 320,245 300,265 280,245" fill="#f59e0b"/><line x1="300" y1="190" x2="300" y2="225" stroke="#94a3b8" stroke-width="2"/><text x="300" y="175" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">Design</text><polygon points="455,225 475,245 455,265 435,245" fill="#f59e0b"/><line x1="455" y1="190" x2="455" y2="225" stroke="#94a3b8" stroke-width="2"/><text x="455" y="175" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">Build</text><polygon points="610,225 630,245 610,265 590,245" fill="#f59e0b"/><line x1="610" y1="190" x2="610" y2="225" stroke="#94a3b8" stroke-width="2"/><text x="610" y="175" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">Test</text><polygon points="765,225 785,245 765,265 745,245" fill="#f59e0b"/><line x1="765" y1="190" x2="765" y2="225" stroke="#94a3b8" stroke-width="2"/><text x="765" y="175" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">Launch</text>
</svg>