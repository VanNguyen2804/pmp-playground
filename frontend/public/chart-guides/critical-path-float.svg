<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><rect width="1000" height="520" rx="28" fill="#f8fbff"/><text x="60" y="62" font-family="Arial" font-size="34" font-weight="700" fill="#102a56">Total float</text><text x="60" y="98" font-family="Arial" font-size="20" fill="#52637a">How long an activity can slip without delaying the project finish</text><line x1="100" y1="260" x2="900" y2="260" stroke="#9aa9bd" stroke-width="5"/><g font-family="Arial" text-anchor="middle"><g fill="#102a56" font-size="18"><text x="180" y="225">ES = 6</text><text x="580" y="225">EF = 10</text><text x="420" y="355">LS = 9</text><text x="820" y="355">LF = 13</text></g><rect x="180" y="238" width="400" height="44" rx="10" fill="#dbeafe" stroke="#1769e0" stroke-width="3"/><text x="380" y="268" font-size="19" font-weight="700" fill="#175cd3">Early schedule</text><rect x="420" y="292" width="400" height="44" rx="10" fill="#ecfdf3" stroke="#039855" stroke-width="3"/><text x="620" y="322" font-size="19" font-weight="700" fill="#027a48">Late schedule</text></g><path d="M180 165 L420 165" stroke="#f79009" stroke-width="5"/><path d="M180 165 l18 -10 v20 z" fill="#f79009"/><path d="M420 165 l-18 -10 v20 z" fill="#f79009"/><text x="300" y="148" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#b54708">Float = 3 days</text><g font-family="Arial" font-size="22" font-weight="700"><rect x="120" y="400" width="340" height="70" rx="16" fill="#fff" stroke="#d0d5dd"/><text x="290" y="443" text-anchor="middle" fill="#102a56">Total Float = LS − ES</text><rect x="540" y="400" width="340" height="70" rx="16" fill="#fff" stroke="#d0d5dd"/><text x="710" y="443" text-anchor="middle" fill="#102a56">Total Float = LF − EF</text></g></svg>